<style>
/* Layout: barra superior com abas; área de trabalho em duas colunas (planilha + resumo fixo), uma coluna no celular. */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --surface-2:#F6F8F9; --ink:#15212B; --muted:#5A6873; --line:#D3DBE0;
  --accent:#1C5D8A; --accent-ink:#FFFFFF; --accent-soft:#DFEBF4;
  --ok:#2C7A4D; --ok-soft:#DDEFE4; --warn:#9A6200; --warn-soft:#F6EAD2; --bad:#B0392D; --bad-soft:#F6DEDA;
  --f-display:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#16202A; --surface-2:#1B2733; --ink:#E2E9EE; --muted:#93A2AE; --line:#2A3846;
  --accent:#62A9DC; --accent-ink:#0A1520; --accent-soft:#1A3246;
  --ok:#5DBF89; --ok-soft:#173528; --warn:#E2A63C; --warn-soft:#3A2D12; --bad:#E57367; --bad-soft:#3E1D1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --surface-2:#1B2733; --ink:#E2E9EE; --muted:#93A2AE; --line:#2A3846;
  --accent:#62A9DC; --accent-ink:#0A1520; --accent-soft:#1A3246;
  --ok:#5DBF89; --ok-soft:#173528; --warn:#E2A63C; --warn-soft:#3A2D12; --bad:#E57367; --bad-soft:#3E1D1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.82rem}
.label{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* topo */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:-.01em}
.tabs{display:flex;gap:2px;flex-wrap:wrap}
.tabs a{padding:7px 12px;border-radius:var(--r);text-decoration:none;color:var(--muted);font-weight:500}
.tabs a:hover{color:var(--ink);background:var(--surface-2)}
.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.sync{margin-left:auto;font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

main{max-width:1320px;margin:0 auto;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:grid;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head p{margin:4px 0 0;color:var(--muted);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* botões */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:var(--r);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--bad)}
.btn.danger{color:var(--bad)}
.btn.confirm{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* formulários */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px 14px}
.field{display:grid;gap:4px;min-width:0}
.field.wide{grid-column:1/-1}
.field label{font-size:.78rem;color:var(--muted);font-weight:500}
input[type=text],input[type=number],input[type=email],input[type=tel],input[type=date],input[type=search],select,textarea{
  width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:7px 9px;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;background:var(--surface)}
textarea{resize:vertical;min-height:70px}

/* lista */
.tbl-wrap{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%}
th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.list tr.open-row{cursor:pointer}
.list tr.open-row:hover td{background:var(--surface-2)}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 8px;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.st-rascunho{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.st-enviado{background:var(--warn-soft);color:var(--warn)}
.st-aprovado{background:var(--ok-soft);color:var(--ok)}
.st-recusado{background:var(--bad-soft);color:var(--bad)}
.tag-ex{background:var(--accent-soft);color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .v{font-family:var(--f-mono);font-size:1.25rem;font-weight:500;margin-top:2px}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.ed-main{display:grid;gap:14px;min-width:0}
.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:14px}
.etapa{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.etapa>header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);border-radius:var(--r) var(--r) 0 0}
.etapa .et-n{font-family:var(--f-mono);font-weight:500;color:var(--accent);min-width:2ch}
.etapa .et-nome{font-family:var(--f-display);font-weight:600;font-size:1rem;background:transparent;border:1px solid transparent;flex:1;min-width:0;padding:4px 6px}
.etapa .et-nome:hover{border-color:var(--line)}
.etapa .et-tot{font-family:var(--f-mono);font-weight:500;white-space:nowrap}
.etapa table input{background:transparent;border:1px solid transparent;padding:5px 6px;border-radius:4px}
.etapa table input:hover{border-color:var(--line)}
.etapa table input:focus{background:var(--surface-2);border-color:var(--accent)}
.etapa td{padding:3px 6px}
.c-item{width:46px;color:var(--muted);font-family:var(--f-mono);font-size:.8rem}
.c-cod{width:92px} .c-un{width:62px} .c-q{width:96px} .c-p{width:118px} .c-t{width:120px} .c-x{width:34px}
.c-cod input{font-family:var(--f-mono);font-size:.82rem}
.c-q input,.c-p input{text-align:right;font-family:var(--f-mono)}
td.tot{font-family:var(--f-mono);text-align:right;white-space:nowrap}
.etapa table{min-width:720px}
.et-actions{display:flex;gap:8px;padding:10px 12px;flex-wrap:wrap}
.sum-line{display:flex;justify-content:space-between;gap:10px;padding:5px 0}
.sum-line span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sum-total{border-top:2px solid var(--ink);margin-top:6px;padding-top:10px;font-weight:600;font-size:1.05rem}
.sum-total span:last-child{font-size:1.3rem;color:var(--accent)}
.bars{display:grid;gap:7px;margin-top:4px}
.bar{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:.8rem}
.bar .track{grid-column:1/-1;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.bar .fill{height:100%;background:var(--accent);border-radius:3px}
.bar span:nth-child(2){font-family:var(--f-mono);color:var(--muted)}
.inline2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:.8rem;color:var(--muted);background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r);padding:10px 12px}
.flag{border-left:3px solid var(--warn);padding:8px 12px;background:var(--warn-soft);border-radius:0 var(--r) var(--r) 0;font-size:.86rem}

/* levantamento */
.lev{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
canvas#iso{width:100%;height:300px;display:block;background:var(--surface-2);border-radius:var(--r);border:1px solid var(--line)}
.lev table input{padding:5px 6px}
.lev .chk{width:auto}

/* modal */
.modal{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-start;justify-content:center;z-index:20;padding:max(40px,env(safe-area-inset-top,0px)) 16px 16px}
.modal-box{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:min(760px,100%);max-height:80vh;display:flex;flex-direction:column;min-width:0}
.modal-box header{display:flex;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}
.modal-box .body{overflow:auto;padding:4px 14px 14px}
.pick-row{display:grid;grid-template-columns:80px 1fr auto auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}
.pick-row:hover{background:var(--accent-soft)}
.pick-grp{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:12px 6px 4px}
iframe#prev{width:100%;height:70vh;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:var(--r);font-size:.88rem;z-index:30;max-width:calc(100% - 32px)}

@media (max-width:980px){.ed,.lev{grid-template-columns:1fr}.side{position:static}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>(+n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const num=(n,d=2)=>(+n||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const parseNum=s=>{if(typeof s==="number")return s;s=String(s??"").trim().replace(/[R$\s]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?n:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
const hoje=()=>new Date().toISOString().slice(0,10);
const dataBR=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return dd+"/"+m+"/"+y};
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}

/* ============ catálogo de referência ============ */
/* Preços compostos (material + mão de obra) aproximados, apenas como ponto de partida.
   Substitua pelos valores do SINAPI do seu estado ou pelos seus próprios custos. */
const GRUPOS=["Serviços preliminares","Fundação","Estrutura","Alvenaria","Cobertura","Instalações elétricas","Instalações hidrossanitárias","Revestimentos e pisos","Esquadrias","Pintura","Serviços complementares"];
const REF=[
 ["01.01","Limpeza mecanizada do terreno","m²",4.5],["01.02","Locação da obra com gabarito de madeira","m²",12],["01.03","Barracão de obra / instalações provisórias","vb",3500],["01.04","Ligações provisórias de água e energia","vb",1800],
 ["02.01","Escavação manual de valas","m³",75],["02.02","Estaca broca Ø 25 cm, concreto armado","m",65],["02.03","Forma de madeira para fundação","m²",95],["02.04","Armação aço CA-50, corte, dobra e montagem","kg",13.5],["02.05","Concreto usinado fck 25 MPa, lançado e adensado","m³",620],["02.06","Impermeabilização de viga baldrame","m²",38],["02.07","Reaterro compactado","m³",45],
 ["03.01","Pilares e vigas em concreto armado (forma, aço e concreto)","m³",2600],["03.02","Laje treliçada h = 12 cm, com capeamento","m²",150],["03.03","Verga e contraverga em concreto","m",45],
 ["04.01","Alvenaria de bloco cerâmico 9x19x19 cm","m²",85],["04.02","Alvenaria de bloco de concreto 14x19x39 cm","m²",95],
 ["05.01","Estrutura de madeira para telhado","m²",120],["05.02","Telhamento com telha cerâmica","m²",75],["05.03","Telhamento com telha de fibrocimento 6 mm","m²",55],["05.04","Calha e rufo em chapa galvanizada","m",85],
 ["06.01","Ponto de tomada ou iluminação, completo","un",180],["06.02","Quadro de distribuição com disjuntores","un",950],["06.03","Entrada de energia padrão concessionária","vb",2800],
 ["07.01","Ponto de água fria, PVC soldável","un",220],["07.02","Ponto de esgoto, PVC","un",200],["07.03","Caixa d'água 1000 L instalada","un",1100],["07.04","Fossa séptica e filtro anaeróbio","vb",4500],["07.05","Louças e metais de banheiro (kit)","cj",1800],
 ["08.01","Chapisco em parede","m²",8],["08.02","Emboço / reboco paulista e = 2 cm","m²",38],["08.03","Contrapiso e = 4 cm","m²",42],["08.04","Piso porcelanato assentado com argamassa","m²",120],["08.05","Revestimento cerâmico de parede","m²",110],["08.06","Forro de PVC","m²",75],["08.07","Forro de gesso acartonado","m²",70],["08.08","Rodapé cerâmico","m",25],
 ["09.01","Porta interna de madeira, completa","un",850],["09.02","Porta externa de madeira maciça, completa","un",1500],["09.03","Janela de alumínio com vidro","m²",650],["09.04","Box de vidro temperado","un",1400],
 ["10.01","Massa corrida PVA, 2 demãos","m²",18],["10.02","Pintura látex acrílica, 2 demãos","m²",22],["10.03","Textura acrílica externa","m²",30],
 ["11.01","Limpeza final da obra","m²",6],["11.02","Muro em bloco de concreto, rebocado","m²",140],["11.03","Calçada em concreto e = 6 cm","m²",70]
];
const catalogoPadrao=()=>REF.map(([cod,desc,un,preco])=>({cod,desc,un,preco,grupo:GRUPOS[+cod.slice(0,2)-1],fonte:"Referência"}));

const configPadrao=()=>({empresa:"",responsavel:"",crea:"",cnpj:"",telefone:"",email:"",cidade:"",bdi:25,validade:15,
  cub:{baixo:2300,normal:2800,alto:3500},cubRef:"",
  condicoes:"30% na assinatura do contrato e o saldo em parcelas conforme medição das etapas.",
  obs:"Não estão inclusos: projetos legais, taxas de prefeitura, ligações definitivas das concessionárias e mobiliário."});

const levPadrao=()=>({pd:2.8,fParede:0.55,fExterno:1.25,fTelhado:1.15,exemplo:true,comodos:[
  {nome:"Sala",c:4.5,l:3.8,molhado:false,portas:1,janelas:2.4},
  {nome:"Cozinha",c:3.5,l:3.0,molhado:true,portas:1,janelas:1.2},
  {nome:"Quarto 1",c:3.5,l:3.2,molhado:false,portas:1,janelas:1.5},
  {nome:"Quarto 2",c:3.2,l:3.0,molhado:false,portas:1,janelas:1.5},
  {nome:"Banheiro",c:2.4,l:1.6,molhado:true,portas:1,janelas:0.36},
  {nome:"Área de serviço",c:2.0,l:1.8,molhado:true,portas:1,janelas:0.6}]});

function novoOrcamento(n){
  return {id:uid(),numero:"ORC-"+new Date().getFullYear()+"-"+String(n).padStart(3,"0"),data:hoje(),status:"rascunho",
    cliente:{nome:"",doc:"",telefone:"",email:"",endereco:""},
    obra:{descricao:"Construção de residência unifamiliar",endereco:"",area:0,padrao:"normal",prazo:"6 meses"},
    bdi:state.config.bdi,desconto:0,validade:state.config.validade,condicoes:state.config.condicoes,obs:state.config.obs,
    etapas:GRUPOS.map(g=>({nome:g,itens:[]})),atualizado:Date.now()};
}
function orcamentoExemplo(){
  const o=novoOrcamento(1);o.exemplo=true;
  o.cliente.nome="Cliente de exemplo";o.obra.area=64;o.obra.endereco="Lote 12, Quadra 4";
  const add=(cod,q)=>{const c=state.catalogo.find(x=>x.cod===cod);if(!c)return;const e=o.etapas.find(x=>x.nome===c.grupo);e&&e.itens.push({cod:c.cod,desc:c.desc,un:c.un,qtd:q,preco:c.preco})};
  [["01.01",120],["01.02",64],["01.03",1],["02.01",9],["02.04",320],["02.05",8],["02.06",42],["03.01",4.5],["03.02",64],["04.01",168],
   ["05.01",74],["05.02",74],["06.01",38],["06.02",1],["07.01",9],["07.02",7],["07.03",1],["07.05",1],
   ["08.02",380],["08.03",64],["08.04",64],["08.05",36],["09.01",5],["09.02",1],["09.03",7.5],["10.02",290],["11.01",64]].forEach(a=>add(...a));
  return o;
}

/* ============ armazenamento ============ */
/* No claude.ai: banco do artifact, numa área privada de cada usuário.
   Aberto como arquivo no computador: localStorage do navegador. */
const LS_KEY="orcaobra:v1";
const Store={
  mode:"carregando",db:null,uid:null,timers:{},busy:{},again:{},
  async init(){
    try{
      if(window.claude&&typeof window.claude.use==="function"){
        const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
        if(db&&user){const id=await user.id();if(id){this.db=db;this.uid=id;this.mode="nuvem";return}}
      }
    }catch(e){}
    this.mode="local";
  },
  col(){return this.db.collection("data/users/"+this.uid)},
  async load(){
    const out={config:null,catalogo:null,lev:null,orcamentos:[]};
    if(this.mode==="nuvem"){
      const snap=await this.col().get();
      snap.docs.forEach(d=>{const v=d.data();if(!v)return;
        if(d.id==="config")out.config=v.v;else if(d.id==="catalogo")out.catalogo=v.v;else if(d.id==="lev")out.lev=v.v;
        else if(d.id.startsWith("o_"))out.orcamentos.push(v.v)});
    }else{
      try{const raw=localStorage.getItem(LS_KEY);if(raw)Object.assign(out,JSON.parse(raw))}catch(e){}
    }
    return out;
  },
  save(key){ // salva com atraso, uma escrita por documento por vez
    clearTimeout(this.timers[key]);
    this.timers[key]=setTimeout(()=>this.flush(key),600);
    setSync("pend");
  },
  async flush(key){
    if(this.mode==="local"){
      try{localStorage.setItem(LS_KEY,JSON.stringify({config:state.config,catalogo:state.catalogo,lev:state.lev,orcamentos:state.orcamentos.filter(o=>!o.exemplo)}));setSync("ok")}
      catch(e){setSync("err","Não foi possível salvar neste navegador. Use Backup para guardar seus dados.")}
      return;
    }
    if(this.mode!=="nuvem")return;
    if(this.busy[key]){this.again[key]=true;return}
    this.busy[key]=true;
    try{
      const ref=this.col().doc(key);
      const val=this.valueFor(key);
      if(val===undefined)await ref.delete();else await ref.set({v:clone(val)});
      setSync("ok");
    }catch(e){setSync("err","Falha ao salvar ("+(e&&e.code||"erro")+"). Suas alterações continuam na tela; tente de novo.")}
    finally{this.busy[key]=false;if(this.again[key]){this.again[key]=false;this.flush(key)}}
  },
  valueFor(key){
    if(key==="config")return state.config;if(key==="catalogo")return state.catalogo;if(key==="lev")return state.lev;
    const o=state.orcamentos.find(x=>"o_"+x.id===key);return o&&!o.exemplo?o:undefined;
  }
};
function setSync(s,msg){
  const el=$("#sync");if(!el)return;
  const label=Store.mode==="nuvem"?"Salvo na sua conta":Store.mode==="local"?"Salvo neste navegador":"Conectando…";
  const map={ok:["ok",label],pend:["warn","Salvando…"],err:["warn",msg||"Erro ao salvar"],load:["warn","Carregando…"]};
  const [cls,txt]=map[s]||map.ok;
  el.innerHTML='<span class="dot '+cls+'"></span><span></span>';el.lastChild.textContent=txt;
}

const state={config:configPadrao(),catalogo:catalogoPadrao(),lev:levPadrao(),orcamentos:[],abertoId:null,tab:"orcamentos"};
state.orcamentos=[orcamentoExemplo()];
function salvarOrc(o){if(o.exemplo){o.exemplo=false;toast("Exemplo convertido em orçamento seu.")}o.atualizado=Date.now();Store.save("o_"+o.id)}

function calc(o){
  const et=o.etapas.map(e=>({nome:e.nome,total:e.itens.reduce((s,i)=>s+(+i.qtd||0)*(+i.preco||0),0)}));
  const direto=et.reduce((s,e)=>s+e.total,0);
  const bdi=direto*(+o.bdi||0)/100, bruto=direto+bdi, desc=bruto*(+o.desconto||0)/100, total=bruto-desc;
  const area=+o.obra.area||0;
  return {et,direto,bdi,desc,total,m2:area>0?total/area:0,area};
}

const confirmar={};
function pedirConfirmacao(btn,key,fn){
  if(confirmar[key]){clearTimeout(confirmar[key]);delete confirmar[key];fn();return}
  const old=btn.textContent;btn.textContent="Confirmar?";btn.classList.add("confirm");
  confirmar[key]=setTimeout(()=>{delete confirmar[key];btn.textContent=old;btn.classList.remove("confirm")},3000);
}
app.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");
  const row=ev.target.closest("tr.open-row");
  if(!b&&row){state.abertoId=row.dataset.id;render();window.scrollTo(0,0);return}
  if(!b)return;
  const act=b.dataset.act;const o=getO();
  const sec=b.closest("[data-e]");const ei=sec?+sec.dataset.e:-1;
  switch(act){
    case "novo":{const n=novoOrcamento(state.orcamentos.filter(x=>!x.exemplo).length+1);state.orcamentos.push(n);state.abertoId=n.id;Store.save("o_"+n.id);render();break}
    case "dup":{const src=state.orcamentos.find(x=>x.id===b.dataset.id);const n=clone(src);n.id=uid();n.exemplo=false;n.status="rascunho";n.data=hoje();n.numero=novoOrcamento(state.orcamentos.length+1).numero;n.cliente.nome=(src.cliente.nome||"")+" (cópia)";n.atualizado=Date.now();state.orcamentos.push(n);Store.save("o_"+n.id);render();toast("Orçamento duplicado.");break}
    case "del":pedirConfirmacao(b,"del"+b.dataset.id,()=>{state.orcamentos=state.orcamentos.filter(x=>x.id!==b.dataset.id);Store.save("o_"+b.dataset.id);render();toast("Orçamento excluído.")});break;
    case "voltar":state.abertoId=null;render();break;
    case "add-etapa":o.etapas.push({nome:"Nova etapa",itens:[]});salvarOrc(o);render();break;
    case "limpar-vazias":o.etapas=o.etapas.filter(e=>e.itens.length);salvarOrc(o);render();break;
    case "del-etapa":pedirConfirmacao(b,"et"+ei,()=>{o.etapas.splice(ei,1);salvarOrc(o);render()});break;
    case "add-blank":o.etapas[ei].itens.push({cod:"",desc:"",un:"un",qtd:1,preco:0});salvarOrc(o);render();setTimeout(()=>{const x=$(`#i-${ei}-${o.etapas[ei].itens.length-1}-desc`);x&&x.focus()},0);break;
    case "add-cat":abrirPicker(ei);break;
    case "del-item":{const ii=+b.closest("[data-i]").dataset.i;o.etapas[ei].itens.splice(ii,1);salvarOrc(o);render();break}
    case "csv":baixar(nomeArq(o)+".csv",planilhaCSV(o),"text/csv");break;
    case "proposta":abrirProposta(o);break;
    case "backup":abrirBackup();break;
    case "lev-add":state.lev.comodos.push({nome:"Cômodo",c:3,l:3,molhado:false,portas:1,janelas:1});levSalvar();renderLev(app);break;
    case "lev-del":state.lev.comodos.splice(+b.dataset.i,1);levSalvar();renderLev(app);break;
    case "lev-gerar":gerarDoLevantamento();break;
    case "cat-add":state.catalogo.unshift({cod:"",desc:"Novo serviço",un:"un",preco:0,grupo:"Serviços complementares",fonte:"Próprio"});Store.save("catalogo");renderCat(app);break;
    case "cat-del":state.catalogo.splice(+b.dataset.i,1);Store.save("catalogo");renderCat(app);break;
    case "cat-reset":pedirConfirmacao(b,"catreset",()=>{state.catalogo=catalogoPadrao();Store.save("catalogo");renderCat(app);toast("Catálogo de referência restaurado.")});break;
    case "cat-csv":$("#imp-csv").click();break;
  }
});

  const draw=q=>{
    q=(q||"").toLowerCase();

  };
  draw("");$("#pk-q").focus();
  $("#pk-q").addEventListener("input",e=>draw(e.target.value));

  root.onclick=e=>{const p=e.target.closest("[data-pick]");if(p){pick(p);return}if(e.target.hasAttribute("data-close"))root.innerHTML=""};

}

/* ============ proposta e exportações ============ */
const nomeArq=o=>(o.numero+"-"+(o.cliente.nome||"cliente")).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w-]+/g,"_");
function planilhaCSV(o){
  const c=calc(o);const L=[["Item","Código","Descrição","Unidade","Quantidade","Preço unitário","Total"]];
  o.etapas.forEach((e,ei)=>{if(!e.itens.length)return;L.push([String(ei+1),"",e.nome.toUpperCase(),"","","",num(c.et[ei].total)]);
    e.itens.forEach((i,ii)=>L.push([`${ei+1}.${ii+1}`,i.cod,i.desc,i.un,num(i.qtd,3),num(i.preco),num((+i.qtd||0)*(+i.preco||0))]))});
  L.push([],["","","Custo direto","","","",num(c.direto)],["","","BDI "+num(o.bdi,1)+"%","","","",num(c.bdi)]);
  if(c.desc)L.push(["","","Desconto "+num(o.desconto,1)+"%","","","","-"+num(c.desc)]);
  L.push(["","","PREÇO TOTAL","","","",num(c.total)]);
  return "﻿"+L.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
}

async function baixar(nome,conteudo,tipo){
  try{
    const dl=window.claude&&window.claude.use?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename:nome,data:new Blob([conteudo],{type:tipo})});toast("Arquivo salvo: "+nome);return}
  }catch(e){if(e&&e.code==="declined")return;if(e&&e.code&&e.code!=="unavailable"){toast("Não foi possível baixar ("+e.code+").");return}}
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([conteudo],{type:tipo}));a.download=nome;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
  catch(e){toast("Download indisponível aqui.")}
}

  root.innerHTML=`<div class="modal" data-close><div class="modal-box" style="width:min(520px,100%)" role="dialog" aria-modal="true" aria-label="Backup">

  $("#bk-imp").onclick=()=>$("#imp-json").click();
  $("#imp-json").onchange=e=>importarJSON(e.target);
  root.onclick=e=>{if(e.target.hasAttribute("data-close"))root.innerHTML=""};

function importarJSON(input){
  const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="orca-obra")throw 0;
    if(d.config){state.config=Object.assign(configPadrao(),d.config);Store.save("config")}
    if(Array.isArray(d.catalogo)){state.catalogo=d.catalogo;Store.save("catalogo")}
    if(d.lev){state.lev=d.lev;Store.save("lev")}
    (d.orcamentos||[]).forEach(o=>{state.orcamentos=state.orcamentos.filter(x=>x.id!==o.id&&!x.exemplo);state.orcamentos.push(o);Store.save("o_"+o.id)});
    $("#modal-root").innerHTML="";render();toast("Backup restaurado.");
  }catch(e){toast("Arquivo inválido: escolha um backup gerado pelo Orça Obra.")}};
  r.readAsText(f);
}

/* ============ levantamento por cômodos ============ */
function levSalvar(){state.lev.exemplo=false;Store.save("lev")}
function levCalc(){
  const L=state.lev,pd=+L.pd||0;let A=0,Aseca=0,Amolh=0,P=0,Pseca=0,parSeca=0,parMolh=0,portas=0,jan=0;
  L.comodos.forEach(r=>{const c=+r.c||0,l=+r.l||0,a=c*l,p=2*(c+l),ab=(+r.portas||0)*0.8*2.1+(+r.janelas||0);
    const par=Math.max(p*pd-ab,0);A+=a;P+=p;portas+=+r.portas||0;jan+=+r.janelas||0;
    if(r.molhado){Amolh+=a;parMolh+=par}else{Aseca+=a;Pseca+=p-(+r.portas||0)*0.8;parSeca+=par}});
  const par=parSeca+parMolh,ext=par*((+L.fExterno||1)-1);
  const q=[
    ["01.01",A],["01.02",A],
    ["04.01",par*(+L.fParede||0)],
    ["05.01",A*(+L.fTelhado||1)],["05.02",A*(+L.fTelhado||1)],
    ["08.01",par+ext],["08.02",par+ext],["08.03",A],["08.04",A],["08.05",parMolh],["08.06",Amolh],["08.07",Aseca],["08.08",Pseca],
    ["09.01",portas],["09.03",jan],
    ["10.01",parSeca],["10.02",parSeca+Aseca],["10.03",ext],["11.01",A]
  ].filter(x=>x[1]>0);
  return {A,P,par,parSeca,parMolh,ext,portas,jan,q};
}

function desenharIso(){
  const cv=$("#iso");if(!cv)return;const dpr=window.devicePixelRatio||1;
  const W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);g.clearRect(0,0,W,H);
  const cs=getComputedStyle(document.documentElement);const col=k=>cs.getPropertyValue(k).trim();
  const rooms=state.lev.comodos.map(r=>({...r,c:+r.c||0,l:+r.l||0})).filter(r=>r.c>0&&r.l>0);
  if(!rooms.length){g.fillStyle=col("--muted");g.font="13px sans-serif";g.fillText("Adicione cômodos para ver o desenho.",16,28);return}
  const total=rooms.reduce((s,r)=>s+r.c*r.l,0);const maxW=Math.max(Math.sqrt(total)*1.45,...rooms.map(r=>r.c));
  let x=0,y=0,rowD=0;const placed=[...rooms].sort((a,b)=>b.c*b.l-a.c*a.l).map(r=>{if(x+r.c>maxW+1e-6){x=0;y+=rowD;rowD=0}const p={...r,x,y};x+=r.c;rowD=Math.max(rowD,r.l);return p});
  const pd=+state.lev.pd||2.8,C=Math.cos(Math.PI/6),S=0.5;
  const pr=(px,py,pz)=>[(px-py)*C,(px+py)*S-pz];
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
  placed.forEach(r=>[[r.x,r.y,0],[r.x+r.c,r.y,0],[r.x,r.y+r.l,0],[r.x+r.c,r.y+r.l,0],[r.x,r.y,pd],[r.x+r.c,r.y,pd],[r.x,r.y+r.l,pd]].forEach(q=>{const[a,b]=pr(...q);mnx=Math.min(mnx,a);mxx=Math.max(mxx,a);mny=Math.min(mny,b);mxy=Math.max(mxy,b)}));
  const pad=18,s=Math.min((W-2*pad)/(mxx-mnx),(H-2*pad)/(mxy-mny));
  const ox=pad+((W-2*pad)-(mxx-mnx)*s)/2-mnx*s,oy=pad+((H-2*pad)-(mxy-mny)*s)/2-mny*s;
  const P=(px,py,pz)=>{const[a,b]=pr(px,py,pz);return[ox+a*s,oy+b*s]};
  const poly=(pts,fill,stroke)=>{g.beginPath();pts.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();if(fill){g.fillStyle=fill;g.fill()}if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke()}};
  const acc=col("--accent"),line=col("--ink"),surf=col("--surface"),soft=col("--accent-soft");
  placed.sort((a,b)=>(a.x+a.y)-(b.x+b.y)).forEach(r=>{
    const{x:X,y:Y,c,l}=r;
    poly([P(X,Y,0),P(X+c,Y,0),P(X+c,Y+l,0),P(X,Y+l,0)],r.molhado?soft:surf,line);
    g.globalAlpha=.55;
    poly([P(X,Y,0),P(X+c,Y,0),P(X+c,Y,pd),P(X,Y,pd)],soft,acc);       // parede do fundo
    poly([P(X,Y,0),P(X,Y+l,0),P(X,Y+l,pd),P(X,Y,pd)],soft,acc);       // parede lateral
    g.globalAlpha=1;
    g.strokeStyle=acc;g.lineWidth=1.2;g.beginPath();
    [[X+c,Y],[X+c,Y+l],[X,Y+l]].forEach(([a,b])=>{g.moveTo(...P(a,b,0));g.lineTo(...P(a,b,pd))});
    g.moveTo(...P(X,Y,pd));[[X+c,Y],[X+c,Y+l],[X,Y+l],[X,Y]].forEach(([a,b])=>g.lineTo(...P(a,b,pd)));g.stroke();
  });
  placed.forEach(({x:X,y:Y,c,l,nome})=>{ // rótulos por cima de tudo
    const[cx,cy]=P(X+c/2,Y+l/2,0);g.textAlign="center";g.lineWidth=3;g.strokeStyle=surf;
    g.font="600 11px 'IBM Plex Sans',sans-serif";g.strokeText(nome,cx,cy);g.fillStyle=line;g.fillText(nome,cx,cy);
    g.font="10px 'IBM Plex Mono',monospace";const m=num(c*l,1)+" m²";g.strokeText(m,cx,cy+13);g.fillStyle=col("--muted");g.fillText(m,cx,cy+13);
  });
}
function gerarDoLevantamento(){
  const r=levCalc();const reais=state.orcamentos.filter(o=>!o.exemplo);
  const root=$("#modal-root");
  root.innerHTML=`<div class="modal" data-close><div class="modal-box" style="width:min(520px,100%)" role="dialog" aria-modal="true" aria-label="Enviar para orçamento">
   <header><h3 style="margin-right:auto">Enviar ${r.q.length} serviços</h3><button class="btn" data-close>Fechar</button></header>
   <div class="body" style="display:grid;gap:12px;padding-top:12px">
    <div class="field"><label for="gv-dest">Orçamento de destino</label><select id="gv-dest"><option value="">Criar novo orçamento</option>${reais.map(o=>`<option value="${esc(o.id)}">${esc(o.numero)} · ${esc(o.cliente.nome||"Sem nome")}</option>`).join("")}</select></div>
    <p class="small muted" style="margin:0">Os itens entram nas etapas correspondentes com os preços do catálogo. Itens com o mesmo código já existentes terão a quantidade substituída.</p>
    <div class="row"><button class="btn primary" id="gv-ok">Enviar</button></div></div></div></div>`;
  root.onclick=e=>{if(e.target.hasAttribute("data-close"))root.innerHTML=""};
  $("#gv-ok").onclick=()=>{
    const id=$("#gv-dest").value;let o=state.orcamentos.find(x=>x.id===id);
    if(!o){o=novoOrcamento(reais.length+1);state.orcamentos.push(o)}
    o.obra.area=Math.round(r.A*100)/100;
    r.q.forEach(([cod,v])=>{const c=state.catalogo.find(x=>x.cod===cod);if(!c)return;
      let e=o.etapas.find(x=>x.nome===c.grupo);if(!e){e={nome:c.grupo,itens:[]};o.etapas.push(e)}
      const qtd=Math.round(v*100)/100;const ex=e.itens.find(i=>i.cod===cod);
      if(ex)ex.qtd=qtd;else e.itens.push({cod:c.cod,desc:c.desc,un:c.un,qtd,preco:c.preco})});
    salvarOrc(o);root.innerHTML="";state.abertoId=o.id;location.hash="#orcamentos";if(state.tab==="orcamentos")render();
    toast("Quantidades enviadas para "+o.numero+". Complete fundação, estrutura e instalações.");
  };
}

function renderCat(app,q=""){
  const ql=q.toLowerCase();
  const itens=state.catalogo.map((c,i)=>({c,i})).filter(({c})=>!ql||(c.desc+" "+c.cod+" "+c.grupo).toLowerCase().includes(ql));
  app.innerHTML=`<div class="view">
  <div class="head"><div><h2>Catálogo de preços</h2><p>Preços unitários usados nos orçamentos. Os valores de referência são aproximados: substitua pelos do SINAPI do seu estado (mês de referência atual) ou pelos seus custos reais.</p></div>
   <div class="row"><button class="btn" data-act="cat-csv">Importar CSV</button><button class="btn danger" data-act="cat-reset">Restaurar referência</button><button class="btn primary" data-act="cat-add">+ Serviço</button></div></div>
  <input type="file" id="imp-csv" accept=".csv,.txt,text/csv" hidden>
  <div class="note">Importar CSV aceita colunas <span class="mono">código; descrição; unidade; preço; grupo</span> (grupo é opcional), separadas por ponto e vírgula ou vírgula. Dá para exportar a planilha do SINAPI no Excel como CSV e importar aqui. Códigos já existentes têm o preço atualizado.</div>
  <div class="panel" style="padding:10px 10px 4px">
   <input type="search" id="cat-q" placeholder="Buscar no catálogo…" value="${esc(q)}" style="margin-bottom:8px">
   <div class="tbl-wrap"><table style="min-width:760px"><thead><tr><th style="width:96px">Código</th><th>Descrição</th><th style="width:70px">Un</th><th style="width:120px" class="r">Preço (R$)</th><th style="width:200px">Etapa</th><th style="width:36px"></th></tr></thead><tbody>
   ${itens.map(({c,i})=>`<tr data-ci="${i}">
     <td><input id="ct-${i}-c" type="text" data-cf="cod" value="${esc(c.cod)}" class="mono small" aria-label="Código"></td>
     <td><input id="ct-${i}-d" type="text" data-cf="desc" value="${esc(c.desc)}" aria-label="Descrição"></td>
     <td><input id="ct-${i}-u" type="text" data-cf="un" value="${esc(c.un)}" aria-label="Unidade"></td>
     <td><input id="ct-${i}-p" type="number" step="any" min="0" data-cf="preco" value="${esc(c.preco)}" class="num" style="text-align:right" aria-label="Preço"></td>
     <td><input id="ct-${i}-g" type="text" data-cf="grupo" value="${esc(c.grupo)}" list="grupos" aria-label="Etapa"></td>
     <td><button class="btn ghost" data-act="cat-del" data-i="${i}" aria-label="Remover" style="padding:4px 8px">×</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">Nada encontrado.</td></tr>'}
   </tbody></table></div>
   <datalist id="grupos">${GRUPOS.map(g=>`<option value="${esc(g)}">`).join("")}</datalist>
   <p class="small muted">${state.catalogo.length} serviços no catálogo.</p>
  </div></div>`;
}
function onCatInput(t){
  if(t.id==="cat-q"){const pos=t.selectionStart;renderCat(app,t.value);const n=$("#cat-q");n.focus();n.setSelectionRange(pos,pos);return}
  const tr=t.closest("[data-ci]");if(!tr||!t.dataset.cf)return;const c=state.catalogo[+tr.dataset.ci];
  c[t.dataset.cf]=t.dataset.cf==="preco"?parseNum(t.value):t.value;c.fonte="Próprio";Store.save("catalogo");
}
function importarCSV(input){
  const f=input.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{
    const linhas=String(r.result).replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim());
    const sep=(linhas[0]||"").split(";").length>1?";":",";
    const split=l=>{const out=[];let cur="",q=false;for(const ch of l){if(ch==='"'){q=!q;continue}if(ch===sep&&!q){out.push(cur.trim());cur="";continue}cur+=ch}out.push(cur.trim());return out};
    let novos=0,atual=0;
    linhas.forEach(l=>{const[cod,desc,un,preco,grupo]=split(l);const p=parseNum(preco);if(!cod||!desc||!(p>0))return; // ignora cabeçalho e linhas sem preço
      const ex=state.catalogo.find(c=>c.cod===cod);
      if(ex){ex.preco=p;if(desc)ex.desc=desc;if(un)ex.un=un;if(grupo)ex.grupo=grupo;ex.fonte="Importado";atual++}
      else{state.catalogo.push({cod,desc,un:un||"un",preco:p,grupo:grupo||"Serviços complementares",fonte:"Importado"});novos++}});
    Store.save("catalogo");renderCat(app);toast(`Importação: ${novos} novos, ${atual} atualizados.`);
  };
  r.readAsText(f,"utf-8");
}
